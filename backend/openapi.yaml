      summary: 希望シフト詳細
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
