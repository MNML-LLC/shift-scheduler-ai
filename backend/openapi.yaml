        stores / staff / roles / skills / shift_patterns / labor_law_constraints /
        store_constraints / shift_validation_rules を 1 レスポンスで返す。
      responses: { '200': { $ref: '#/components/responses/ItemSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }

  /api/master/divisions/{division_id}:
    put:
      tags: [Master (Divisions CRUD)]
      summary: 事業部更新
      parameters: [ { in: path, name: division_id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/ItemSuccess' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete:
      tags: [Master (Divisions CRUD)]
      summary: 事業部削除
      parameters: [ { in: path, name: division_id, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/ItemSuccess' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }

  # 事業部作成 (POST /api/master/divisions は上の list 定義に追加)
  # POST /api/master/divisions は下記でまとめて追加
  /api/master/stores/{store_id}:
    put:
      tags: [Master (Stores CRUD)]
      summary: 店舗更新 (部分)
      parameters: [ { in: path, name: store_id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/ItemSuccess' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete:
      tags: [Master (Stores CRUD)]
      summary: 店舗論理削除
      parameters: [ { in: path, name: store_id, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/ItemSuccess' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/ServerError' } }

  # =========================================================================
  # Shifts (Plans)
  # =========================================================================
  /api/shifts/plans:
    get:
      tags: [Shifts (Plans)]
      summary: シフト計画 (plans) 一覧
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
        - { in: query, name: store_id, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, APPROVED, CONFIRMED] } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }

  /api/shifts/plans/{id}:
    get:
      tags: [Shifts (Plans)]
      summary: シフト計画詳細
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/generate:
    post:
      tags: [Shifts (Plans)]
      summary: FIRST 計画を前月 SECOND から生成 (曜日マッピング)
      description: |
        前月の SECOND 計画から曜日別にシフトを複製し、対象年月の FIRST 計画を作成 (既存なら更新)。
        - `201` 新規作成 / `200` 更新
        - `409` unique 制約違反 / `400` FK 違反または過去月指定 / `404` 前月 SECOND なし
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_id, year, month]
              properties:
                tenant_id: { type: string }
                store_id: { type: string }
                year: { type: integer }
                month: { type: integer, minimum: 1, maximum: 12 }
                created_by: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '201': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: unique 制約違反, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/generate-ai:
    post:
      tags: [Shifts (Plans)]
      summary: AI によるシフト計画生成 (同期)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_id, year, month]
              properties:
                tenant_id: { type: string }
                store_id: { type: string }
                year: { type: integer }
                month: { type: integer, minimum: 1, maximum: 12 }
                created_by: { type: string, nullable: true }
                options:
                  type: object
                  properties:
                    model: { type: string }
                    temperature: { type: number }
                    maxRetries: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '201': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: 生成失敗 (phase, elapsed_ms を含む)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/shifts/plans/generate-ai/stream:
    get:
      tags: [Shifts (Plans)]
      summary: AI シフト生成 (SSE ストリーム)
      description: |
        Server-Sent Events で `progress` / `complete` / `error` イベントを配信。
        HTTP ステータスコードによるエラー通知は行わず、`error` イベントで通知。
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: store_id, required: true, schema: { type: string } }
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer } }
        - { in: query, name: created_by, schema: { type: string } }
        - { in: query, name: options, description: JSON 文字列, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/shifts/plans/approve-first:
    post:
      tags: [Shifts (Plans)]
      summary: FIRST 計画の承認
      description: LINE 通知を伴う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
                tenant_id: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/approve-second:
    post:
      tags: [Shifts (Plans)]
      summary: SECOND 計画の保存・承認
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, year, month, shifts]
              properties:
                tenant_id: { type: string, nullable: true }
                store_id: { type: string, nullable: true }
                plan_id: { type: string }
                year: { type: integer }
                month: { type: integer }
                shifts:
                  type: array
                  items:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      name: { type: string }
                      time: { type: string }
                      preferred: { type: boolean }
                      skill: { type: string }
                created_by: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/monthly-first-plan-batch:
    post:
      tags: [Shifts (Plans)]
      summary: 月次 FIRST 計画バッチ生成 (バッチAPI)
      description: |
        `x-batch-api-key` ヘッダ検証によるパブリックエンドポイント。
        全店舗の FIRST 計画をアイテムポテントに作成 (既存はスキップ)。
      parameters:
        - { in: header, name: x-batch-api-key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_year, target_month]
              properties:
                target_year: { type: integer }
                target_month: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: 実行結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  target_year: { type: integer }
                  target_month: { type: integer }
                  created: { type: integer }
                  skipped_already: { type: integer }
                  failed: { type: integer }
                  failed_notification: { type: integer }
        '401': { description: 不正なバッチキー, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/{plan_id}:
    delete:
      tags: [Shifts (Plans)]
      summary: 計画と配下シフト削除 (トランザクション)
      parameters:
        - { in: path, name: plan_id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '403': { description: PAST_MONTH_DELETE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/{plan_id}/status:
    put:
      tags: [Shifts (Plans)]
      summary: 計画ステータス更新
      parameters:
        - { in: path, name: plan_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, APPROVED, CONFIRMED] }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/copy-from-previous:
    post:
      tags: [Shifts (Plans)]
      summary: 指定店舗で前月 SECOND を複製し新規 DRAFT 作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, target_year, target_month]
              properties:
                tenant_id: { type: string, nullable: true }
                store_id: { type: string }
                target_year: { type: integer }
                target_month: { type: integer }
                created_by: { type: string, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/copy-from-previous-all-stores:
    post:
      tags: [Shifts (Plans)]
      summary: 全店舗一括で前月 SECOND を複製
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_year, target_month]
              properties:
                tenant_id: { type: string, nullable: true }
                target_year: { type: integer }
                target_month: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/fetch-previous-data-all-stores:
    post:
      tags: [Shifts (Plans)]
      summary: 前月データのプレビュー (書き込みなし)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_year, target_month]
              properties:
                tenant_id: { type: string, nullable: true }
                target_year: { type: integer }
                target_month: { type: integer }
      responses:
        '200':
          description: プレビュー結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      target_year: { type: integer }
                      target_month: { type: integer }
                      stores:
                        type: array
                        items:
                          type: object
                          properties:
                            store_id: { type: string }
                            store_name: { type: string }
                            source_plan: { type: object }
                            shifts: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/plans/create-with-shifts:
    post:
      tags: [Shifts (Plans)]
      summary: 計画+シフトの一括作成/更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_year, target_month, stores]
              properties:
                tenant_id: { type: string, nullable: true }
                target_year: { type: integer }
                target_month: { type: integer }
                created_by: { type: string, nullable: true }
                plan_type: { type: string, enum: [FIRST, SECOND] }
                stores:
                  type: array
                  items:
                    type: object
                    properties:
                      store_id: { type: string }
                      shifts:
                        type: array
                        items:
                          type: object
                          properties:
                            staff_id: { type: string }
                            shift_date: { type: string, format: date }
                            pattern_id: { type: string, nullable: true }
                            start_time: { type: string }
                            end_time: { type: string }
                            break_minutes: { type: integer, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # Shifts (Read / Write)
  # =========================================================================
  /api/shifts:
    get:
      tags: [Shifts (Read)]
      summary: シフト一覧
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
        - { in: query, name: plan_id, schema: { type: string } }
        - { in: query, name: store_id, schema: { type: string } }
        - { in: query, name: staff_id, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer } }
        - { in: query, name: date_from, schema: { type: string, format: date } }
        - { in: query, name: date_to, schema: { type: string, format: date } }
        - { in: query, name: is_modified, schema: { type: boolean } }
        - { in: query, name: plan_type, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Shifts (Write)]
      summary: シフト作成
      description: 同一スタッフ/日で時間帯重複がある場合は `400 TIME_OVERLAP` を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_id, plan_id, staff_id, shift_date, pattern_id, start_time, end_time, break_minutes]
              properties:
                tenant_id: { type: string }
                store_id: { type: string }
                plan_id: { type: string }
                staff_id: { type: string }
                shift_date: { type: string, format: date }
                pattern_id: { type: string }
                start_time: { type: string }
                end_time: { type: string }
                break_minutes: { type: integer }
                total_hours: { type: number, nullable: true }
                labor_cost: { type: number, nullable: true }
                assigned_skills: { type: array, items: { type: string }, nullable: true }
                is_preferred: { type: boolean, nullable: true }
                is_modified: { type: boolean, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/ItemSuccess' }
        '400':
          description: バリデーション / TIME_OVERLAP / FK 違反
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/{id}:
    get:
      tags: [Shifts (Read)]
      summary: シフト詳細
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Shifts (Write)]
      summary: シフト更新 (部分)
      description: |
        `store_id` を変更した場合、対象店舗の計画が無ければ `STORE_TRANSFER` として自動作成する。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400':
          description: バリデーション / TIME_OVERLAP / FK / break_minutes 不正
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Shifts (Write)]
      summary: シフト物理削除
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/monthly-comments:
    get:
