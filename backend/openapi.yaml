openapi: 3.0.3
info:
  title: AIシフト管理システム バックエンドAPI
  description: |
    シフトスケジューリング・給与管理・LIFF 連携・AI(OpenAI) プロキシを提供するバックエンド API。

    本 YAML はバックエンドが公開する **全エンドポイントの唯一のソース (Single Source of Truth)** です。
    エンドポイントを追加・変更した場合は、必ず本ファイルを更新してください。

    ## 主な機能
    - シフト計画 (FIRST / SECOND) の作成・承認・複製・AI 生成
    - スタッフ / 店舗 / 役職 / スキル / シフトパターン等のマスタ CRUD
    - 給与・売上・労働時間の分析データ登録・参照
    - マルチテナント管理 (tenants)
    - LINE LIFF (スタッフ側) 経由の希望シフト登録・月次提出
    - OpenAI (Chat Completions / Assistants / Vector Store) プロキシ
    - CSV 読み書き / OpenAI ファイル (CSV→JSON 変換) アップロード
    - 祝日 (内閣府 CSV) の取得
    - ヘルスチェック (DB 到達性)

    ## 認証
    - パブリック: `/api/health`, `/api/liff/**`, `POST /api/shifts/plans/monthly-first-plan-batch`
    - その他: `authenticate` ミドルウェアによる認証必須
    - LIFF: `verifyLineToken` ミドルウェアで LINE ID トークン検証 (`/api/liff/deadline-settings` を除く)
    - バッチ: `POST /api/shifts/plans/monthly-first-plan-batch` は `x-batch-api-key` ヘッダで検証

    ## エラー
    - `DatabaseUnavailableError` は 503 で `{ error: string }` を返す (グローバルハンドラ)
    - 通常のエラーは 500 `{ success:false, error: string }` を返す

  version: 2.0.0
  contact:
    name: shift M-layer (info-mnml/shift-scheduler-ai)

servers:
  - url: http://localhost:3001
    description: ローカル開発環境
  - url: https://shift-scheduler-ai-production.up.railway.app
    description: 本番 (Railway)

tags:
  - name: Health
  - name: Tenants
  - name: Master (Read)
  - name: Master (Staff CRUD)
  - name: Master (Roles CRUD)
  - name: Master (Stores CRUD)
  - name: Master (Skills CRUD)
  - name: Master (Employment Types CRUD)
  - name: Master (Shift Patterns CRUD)
  - name: Master (Divisions CRUD)
  - name: Master (Commute Allowance CRUD)
  - name: Master (Insurance Rates CRUD)
  - name: Master (Tax Brackets CRUD)
  - name: Shifts (Read)
  - name: Shifts (Write)
  - name: Shifts (Plans)
  - name: Shifts (Preferences)
  - name: Analytics
  - name: LIFF
  - name: Holidays
  - name: OpenAI Proxy
  - name: Vector Store
  - name: CSV

# ---------------------------------------------------------------------------
paths:
  # =========================================================================
  # Health
  # =========================================================================
  /api/health:
    get:
      tags: [Health]
      summary: ヘルスチェック
      description: DB 到達性を確認する。運用監視・staging 検証で使用。
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
        '503': { description: DB 到達不可, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }

  # =========================================================================
  # Tenants
  # =========================================================================
  /api/tenants:
    get:
      tags: [Tenants]
      summary: アクティブテナント一覧
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tenants/{tenant_id}:
    get:
      tags: [Tenants]
      summary: テナント詳細
      parameters:
        - { in: path, name: tenant_id, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '404': { description: TENANT_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # Master (Read)
  # =========================================================================
  /api/master/tenants:
    get: { tags: [Master (Read)], summary: マスタ用 テナント一覧, responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } } }
  /api/master/divisions:
    get:
      tags: [Master (Read)]
      summary: 事業部 (division) 一覧
      parameters: [ { $ref: '#/components/parameters/TenantIdQueryOptional' } ]
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Master (Divisions CRUD)]
      summary: 事業部作成 (201)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '201': { $ref: '#/components/responses/ItemSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/ServerError' } }
  /api/master/stores:
    get:
      tags: [Master (Read)]
      summary: 店舗 (stores) 一覧
      parameters: [ { $ref: '#/components/parameters/TenantIdQueryOptional' } ]
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Master (Stores CRUD)]
      summary: 店舗作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_code, store_name, division_id]
              properties:
                tenant_id: { type: string }
                store_code: { type: string }
                store_name: { type: string }
                division_id: { type: string }
                address: { type: string, nullable: true }
                phone_number: { type: string, nullable: true }
                business_hours_start: { type: string, nullable: true }
                business_hours_end: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/master/staff:
    get:
      tags: [Master (Read)]
      summary: スタッフ一覧
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryOptional' }
        - { in: query, name: store_id, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Master (Staff CRUD)]
      summary: スタッフ作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, staff_code, name]
              properties:
                tenant_id: { type: string }
                staff_code: { type: string }
                name: { type: string }
                email: { type: string, nullable: true }
                phone_number: { type: string, nullable: true }
                employment_type: { type: string, nullable: true }
                hire_date: { type: string, format: date, nullable: true }
                monthly_salary: { type: number, nullable: true }
                hourly_rate: { type: number, nullable: true }
                store_id: { type: string, nullable: true }
                role_id: { type: string, nullable: true }
                division_id: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/master/staff/{staff_id}:
