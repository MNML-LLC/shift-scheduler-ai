      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Shifts (Preferences)]
      summary: 希望シフト削除
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/shifts/preferences/bulk:
    post:
      tags: [Shifts (Preferences)]
      summary: 希望シフト一括登録 (月単位 delete-then-insert)
      description: |
        トランザクション内で対象月の希望シフトを一旦削除し、渡された配列を挿入する。
        同時に `staff_monthly_submissions` を UPSERT する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_id, staff_id, preferences]
              properties:
                tenant_id: { type: string }
                store_id: { type: string }
                staff_id: { type: string }
                year: { type: integer, nullable: true }
                month: { type: integer, nullable: true }
                preferences:
                  type: array
                  items:
                    type: object
                    properties:
                      preference_date: { type: string, format: date }
                      is_ng: { type: boolean }
                      start_time: { type: string }
                      end_time: { type: string }
                      notes: { type: string }
      responses:
        '201':
          description: 実行結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  deleted: { type: integer }
                  inserted: { type: integer }
                  inserted_ids: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # Analytics
  # =========================================================================
  /api/analytics/payroll:
    get:
      tags: [Analytics]
      summary: 給与データ取得
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
        - { in: query, name: store_id, schema: { type: string } }
        - { in: query, name: staff_id, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Analytics]
      summary: 給与データ一括登録 (UPSERT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkPayloadPayroll' } } } }
      responses:
        '200': { $ref: '#/components/responses/BulkSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/analytics/sales-actual:
    get:
      tags: [Analytics]
      summary: 売上実績データ取得
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
        - { in: query, name: store_id, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Analytics]
      summary: 売上実績データ一括登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, data]
              properties:
                tenant_id: { type: string }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      year: { type: integer }
                      month: { type: integer }
                      store_id: { type: string, nullable: true }
                      actual_sales: { type: number }
                      daily_average: { type: number, nullable: true }
                      notes: { type: string, nullable: true }
      responses:
        '200':
          description: 登録件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  insertCount: { type: integer }
                  updateCount: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/analytics/sales-forecast:
    get:
      tags: [Analytics]
      summary: 売上予測データ取得
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
        - { in: query, name: store_id, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/ServerError' } }
    post:
      tags: [Analytics]
      summary: 売上予測データ一括登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, data]
              properties:
                tenant_id: { type: string }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      year: { type: integer }
                      month: { type: integer }
                      store_id: { type: string, nullable: true }
                      forecasted_sales: { type: number }
                      required_labor_cost: { type: number, nullable: true }
                      required_hours: { type: number, nullable: true }
                      notes: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/BulkSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/analytics/dashboard-metrics:
    get:
      tags: [Analytics]
      summary: ダッシュボード指標
      parameters:
        - { $ref: '#/components/parameters/TenantIdQueryRequired' }
        - { in: query, name: metric_name, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/ServerError' } }

  /api/analytics/work-hours:
    post:
      tags: [Analytics]
      summary: 労働時間実績 一括登録 (UPSERT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, data]
              properties:
                tenant_id: { type: string }
                data:
                  type: array
                  items:
                    type: object
                    required: [staff_id, shift_date, actual_start, actual_end, actual_hours]
                    properties:
                      store_id: { type: string, nullable: true }
                      staff_id: { type: string }
                      shift_date: { type: string, format: date }
                      scheduled_start: { type: string, nullable: true }
                      scheduled_end: { type: string, nullable: true }
                      actual_start: { type: string }
                      actual_end: { type: string }
                      actual_hours: { type: number }
                      break_minutes: { type: integer, nullable: true }
                      is_overtime: { type: boolean, nullable: true }
                      overtime_minutes: { type: integer, nullable: true }
                      is_late: { type: boolean, nullable: true }
                      is_early_leave: { type: boolean, nullable: true }
                      notes: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/BulkSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # LIFF (LINE)
  # =========================================================================
  /api/liff/shift-request:
    post:
      tags: [LIFF]
      summary: 希望シフト送信 (LINE ID Token 認証)
      description: LINE 上のスタッフが希望シフトを登録・更新する。
      security: [ { LineIdToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_dates]
              properties:
                shift_dates:
                  type: array
                  items:
                    type: object
                    required: [date, start_time, end_time]
                    properties:
                      date: { type: string, format: date }
                      start_time: { type: string }
                      end_time: { type: string }
      responses:
        '200':
          description: 登録・更新結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      staff_id: { type: string }
                      store_id: { type: string }
                      shifts:
                        type: array
                        items:
                          type: object
                          properties:
                            shift_id: { type: string }
                            date: { type: string, format: date }
                            start_time: { type: string }
                            end_time: { type: string }
                            action: { type: string, enum: [created, updated] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [LIFF]
      summary: 月次希望シフト取得
      security: [ { LineIdToken: [] } ]
      parameters:
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/liff/staff-info:
    get:
      tags: [LIFF]
      summary: 自分のスタッフ情報取得
      security: [ { LineIdToken: [] } ]
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/liff/check-link:
    get:
      tags: [LIFF]
      summary: LINE 連携状態確認
      security: [ { LineIdToken: [] } ]
      responses:
        '200':
          description: 連携状態
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  linked: { type: boolean }
                  data: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/liff/deadline-settings:
    get:
      tags: [LIFF]
      summary: 締切設定取得 (LINE 認証不要)
      parameters: [ { $ref: '#/components/parameters/TenantIdQueryRequired' } ]
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/liff/register-staff:
    post:
      tags: [LIFF]
      summary: スタッフ登録 + LINE 連携
      security: [ { LineIdToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, store_id, role_id, name, staff_code, employment_type]
              properties:
                tenant_id: { type: string }
                store_id: { type: string }
                role_id: { type: string }
                name: { type: string }
                staff_code: { type: string }
                employment_type: { type: string }
                email: { type: string, nullable: true }
                phone_number: { type: string, nullable: true }
      responses:
        '200':
          description: 作成結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      staff_id: { type: string }
                      name: { type: string }
                      staff_code: { type: string }
                      line_user_id: { type: string }
        '400': { description: バリデーション / 既に連携 / staff_code 重複 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/liff/monthly-submission:
    get:
      tags: [LIFF]
      summary: 月次提出レコード取得
      security: [ { LineIdToken: [] } ]
      parameters:
        - { in: query, name: year, required: true, schema: { type: integer } }
        - { in: query, name: month, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 提出レコード (存在しない場合は `data:null` を返す)
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessBase' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [LIFF]
      summary: 月次提出 UPSERT
      security: [ { LineIdToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer }
                month: { type: integer }
                comment: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 登録・更新結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      submission_id: { type: string }
                      year: { type: integer }
                      month: { type: integer }
                      comment: { type: string }
                      submission_status: { type: string }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # Holidays
  # =========================================================================
  /api/holidays:
    get:
      tags: [Holidays]
      summary: 全祝日 (内閣府 CSV 由来、24h キャッシュ)
      responses:
        '200':
          description: 年/月別 祝日一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          properties:
                            day: { type: integer }
                            name: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/holidays/{year}:
    get:
      tags: [Holidays]
      summary: 年別祝日
      parameters: [ { in: path, name: year, required: true, schema: { type: integer, minimum: 1900, maximum: 2100 } } ]
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/holidays/{year}/{month}:
    get:
      tags: [Holidays]
      summary: 年月別祝日
      parameters:
        - { in: path, name: year, required: true, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { in: path, name: month, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # Vector Store (DB マスタ→Vector Store 構築)
  # =========================================================================
  /api/vector-store/setup:
    post:
      tags: [Vector Store]
      summary: DB マスタから Vector Store を構築
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string }
                storeId: { type: string, nullable: true }
      responses:
        '200':
          description: 構築結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  vectorStoreId: { type: string }
                  filesUploaded: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # =========================================================================
  # OpenAI Proxy
  # =========================================================================
  /api/openai/chat/completions:
    post:
      tags: [OpenAI Proxy]
      summary: OpenAI Chat Completions プロキシ
      description: |
        リクエストボディをそのまま OpenAI に転送する。レート制限あり。
        `OPENAI_API_KEY` 未設定時は `503 AI_UNAVAILABLE` を返す。
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: OpenAI レスポンスをそのまま返却 }
        '500': { $ref: '#/components/responses/AIError' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /api/openai/vector_stores:
    post:
      tags: [OpenAI Proxy]
      summary: Vector Store 作成 (OpenAI)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: 作成成功 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/vector_stores/{vectorStoreId}/files:
    post:
      tags: [OpenAI Proxy]
      summary: Vector Store にファイル追加
      parameters: [ { in: path, name: vectorStoreId, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { file_id: { type: string } } } } } }
      responses: { '200': { description: 追加成功 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/files:
    post:
      tags: [OpenAI Proxy]
      summary: CSV→JSON 変換してファイルアップロード
      description: |
        `frontend/public` 相対パスの CSV を Papa Parse で JSON 変換し、
        一時ファイルとして OpenAI にアップロード後、削除する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                filePath: { type: string, example: "data/master/staff.csv" }
      responses:
        '200':
          description: OpenAI File オブジェクト
        '500': { $ref: '#/components/responses/AIError' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /api/openai/files/{fileId}/content:
    get:
      tags: [OpenAI Proxy]
      summary: ファイルダウンロード
      parameters: [ { in: path, name: fileId, required: true, schema: { type: string } } ]
      responses:
        '200': { description: raw text, content: { text/plain: { schema: { type: string } } } }
        '500': { $ref: '#/components/responses/AIError' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /api/openai/assistants:
    post:
      tags: [OpenAI Proxy]
      summary: Assistant 作成
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: 作成成功 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/threads:
    post:
      tags: [OpenAI Proxy]
      summary: Thread 作成
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: 作成成功 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/threads/{threadId}/messages:
    post:
      tags: [OpenAI Proxy]
      summary: Message 追加
      parameters: [ { in: path, name: threadId, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [user, assistant] }
                content: { type: string }
      responses: { '200': { description: 追加成功 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }
    get:
      tags: [OpenAI Proxy]
      summary: Message 一覧取得
      parameters: [ { in: path, name: threadId, required: true, schema: { type: string } } ]
      responses: { '200': { description: 一覧 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/threads/{threadId}/runs:
    post:
      tags: [OpenAI Proxy]
      summary: Run 実行
      parameters: [ { in: path, name: threadId, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assistant_id: { type: string }
                instructions: { type: string }
      responses: { '200': { description: 実行開始 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  /api/openai/threads/{threadId}/runs/{runId}:
    get:
      tags: [OpenAI Proxy]
      summary: Run 状態取得
      parameters:
        - { in: path, name: threadId, required: true, schema: { type: string } }
        - { in: path, name: runId, required: true, schema: { type: string } }
      responses: { '200': { description: 状態 }, '500': { $ref: '#/components/responses/AIError' }, '503': { $ref: '#/components/responses/AIUnavailable' } }

  # =========================================================================
  # CSV
  # =========================================================================
  /api/save-csv:
    post:
      tags: [CSV]
      summary: CSV ファイル保存
      description: |
        `frontend/public/data/generated/{filename}` に CSV を書き込む。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content]
              properties:
                filename: { type: string, example: "shift_2024_11.csv" }
                content: { type: string, example: "name,date,shift\nJohn,2024-11-01,Morning" }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/load-csv:
    get:
      tags: [CSV]
      summary: CSV ファイル読み込み
      parameters:
        - { in: query, name: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ItemSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

# ---------------------------------------------------------------------------
components:
  parameters:
    TenantIdQueryOptional:
      in: query
      name: tenant_id
      required: false
      schema: { type: string }
      description: 省略時は `1` を用いるルートもある (master 系)
    TenantIdQueryRequired:
      in: query
      name: tenant_id
      required: true
      schema: { type: string }

  schemas:
    SuccessBase:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object, nullable: true }
        message: { type: string, nullable: true }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string, nullable: true }

    HealthResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string, enum: [ok, error] }
        version: { type: string }
        backend:
          type: object
          properties:
            environment: { type: string }
            hostname: { type: string }
            port: { type: string }
            nodeEnv: { type: string }
        database:
          type: object
          properties:
            environment: { type: string }
            connected: { type: boolean }
            host: { type: string }

    BulkPayloadPayroll:
      type: object
      required: [tenant_id, data]
      properties:
        tenant_id: { type: string }
        data:
          type: array
          items:
            type: object
            required: [year, month, staff_id, staff_name, work_days, work_hours, base_salary, gross_salary, net_salary]
            properties:
              store_id: { type: string, nullable: true }
              year: { type: integer }
              month: { type: integer }
              staff_id: { type: string }
              staff_name: { type: string }
              work_days: { type: integer }
              work_hours: { type: number }
              base_salary: { type: number }
              overtime_pay: { type: number, nullable: true }
              commute_allowance: { type: number, nullable: true }
              other_allowances: { type: number, nullable: true }
              gross_salary: { type: number }
              health_insurance: { type: number, nullable: true }
              pension_insurance: { type: number, nullable: true }
              employment_insurance: { type: number, nullable: true }
              income_tax: { type: number, nullable: true }
              resident_tax: { type: number, nullable: true }
              total_deduction: { type: number, nullable: true }
              net_salary: { type: number }
              payment_date: { type: string, format: date, nullable: true }
              payment_status: { type: string, nullable: true }

  responses:
    ListSuccess:
      description: 一覧取得成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:
                type: array
                items: { type: object }
    ItemSuccess:
      description: 取得・作成・更新成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessBase' }
    BulkSuccess:
      description: 一括処理成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              total: { type: integer }
    ValidationError:
      description: バリデーションエラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 該当データなし
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: サーバーエラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AIError:
      description: AI 実行エラー
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { type: string, example: "AIサービスでエラーが発生しました" }
              code: { type: string, example: "AI_ERROR" }
    AIUnavailable:
      description: OpenAI 機能無効
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { type: string, example: "OpenAI機能は現在利用できません。OPENAI_API_KEYを設定してください。" }
              code: { type: string, example: "AI_UNAVAILABLE" }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 通常 API の認証 (Bearer トークン)
    LineIdToken:
      type: http
      scheme: bearer
      description: LIFF エンドポイント用 LINE ID トークン
    BatchApiKey:
      type: apiKey
      in: header
      name: x-batch-api-key
      description: バッチエンドポイント (`monthly-first-plan-batch`) 用

security:
  - BearerAuth: []
